name: Entity Validation

on:
  push:
    branches:
      - 'work/**'
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-entity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Cloudflare Function syntax
        run: node --check functions/api/lead.js

      - name: Lead delivery (two channels, alarm, probe)
        run: node scripts/test_lead_delivery.mjs

      # Scooter, 13 Nov 2026: no dashboard page or data without the password; finance for
      # Scooter only (the owners list is Scooter alone); sending off; no private figures in this repo.
      - name: Productions dashboard gate
        run: node --check "functions/dashboard/[[path]].js" && node scripts/test_dashboard.mjs

      - name: Build all three sites
        run: npm run build

      # The build only proves files were copied. This proves the forms actually
      # transmit: every field named, every form wired to an endpoint, no
      # onsubmit="return false", no file input without a declared transport,
      # honeypot names hidden and matching functions/api/lead.js, and - driven
      # against a stubbed fetch - no success message reachable without a
      # confirmed server response. Runs on dist/ as well as sites/, so a built
      # page cannot regress independently of its source.
      - name: Validate forms transmit
        run: npm run validate:forms

      # Finding 1 and finding 2 both went undetected because nothing in this
      # repo ever read page copy or link attributes. Six of the seven ventures
      # pages carried no on-page securities disclosure - only a footer link to
      # /disclosures - and five third-party links carried no rel at all, four
      # of them the regulatory citations on the disclosures page itself. This
      # asserts both, over sites/ and dist/.
      - name: Validate securities disclosure and outbound link rel
        run: npm run validate:disclosure

      # Scooter's 20 Sep 2026 rule: no ventures page may navigate to the
      # community, agency or live properties; the nav is the shared seven-item
      # bar with a mobile toggle; every anchor resolves; retired pages redirect.
      - name: Validate ventures isolation and navigation
        run: npm run validate:ventures-isolation

      # Same rule on the community site: no navigable link to a sister property;
      # no personal address; The Update keeps its consent radios and server gate.
      - name: Validate community site (sister links, consent, form gate)
        run: npm run validate:community-site
