name: Entity Validation

on:
  push:
    branches:
      - 'work/**'
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-entity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate structured data
        run: |
          python - <<'PY'
          import json, pathlib, re

          targets = {
              'sites/community/index.html': 'https://joinwestpeek.com/#organization',
              'sites/ventures/index.html': 'https://westpeek.ventures/#organization',
              'sites/productions/index.html': 'https://westpeekproductions.com/#organization',
          }

          parsed = {}
          for path, org_id in targets.items():
              html = pathlib.Path(path).read_text(encoding='utf-8')
              blocks = re.findall(r'<script\s+type="application/ld\+json">\s*(.*?)\s*</script>', html, flags=re.S)
              assert blocks, f'No JSON-LD block found in {path}'
              data = json.loads(blocks[0])
              assert data.get('@context') == 'https://schema.org', path
              graph = data.get('@graph')
              assert isinstance(graph, list) and graph, f'Missing @graph in {path}'
              by_id = {n.get('@id'): n for n in graph if isinstance(n, dict) and n.get('@id')}
              assert org_id in by_id, f'Missing {org_id} in {path}'
              parsed[path] = by_id

          community = parsed['sites/community/index.html']['https://joinwestpeek.com/#organization']
          productions = parsed['sites/productions/index.html']['https://westpeekproductions.com/#organization']
          ventures_map = parsed['sites/ventures/index.html']
          ventures = ventures_map['https://westpeek.ventures/#organization']

          assert community['@id'] != productions['@id'] != ventures['@id']

          members = ventures.get('member', [])
          refs = {m.get('@id') for m in members if isinstance(m, dict)}
          assert 'https://scootertaylor.com/#person' in refs
          assert 'https://sequoiataylor.com/#person' in refs

          scooter = ventures_map['https://scootertaylor.com/#person']
          sequoia = ventures_map['https://sequoiataylor.com/#person']
          assert scooter.get('jobTitle') == 'General Partner'
          assert sequoia.get('jobTitle') == 'General Partner'
          assert scooter.get('worksFor', {}).get('@id') == ventures['@id']
          assert sequoia.get('worksFor', {}).get('@id') == ventures['@id']

          assert 'https://westpeek.ventures/' in community.get('relatedLink', [])
          assert 'https://westpeekproductions.com/' in community.get('relatedLink', [])
          assert 'https://joinwestpeek.com/' in productions.get('relatedLink', [])
          assert 'https://joinwestpeek.com/' in ventures.get('relatedLink', [])

          print('West Peek entity graph validation PASS')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Cloudflare Function syntax
        run: node --check functions/api/lead.js

      - name: Build all three sites
        run: npm run build

      - name: Validate Community Viability Assessment
        run: npm run validate:community-viability

      # The build only proves files were copied. This proves the forms actually
      # transmit: every field named, every form wired to an endpoint, no
      # onsubmit="return false", no file input without a declared transport,
      # honeypot names hidden and matching functions/api/lead.js, and - driven
      # against a stubbed fetch - no success message reachable without a
      # confirmed server response. Runs on dist/ as well as sites/, so a built
      # page cannot regress independently of its source.
      - name: Validate forms transmit
        run: npm run validate:forms

      # Finding 1 and finding 2 both went undetected because nothing in this
      # repo ever read page copy or link attributes. Six of the seven ventures
      # pages carried no on-page securities disclosure - only a footer link to
      # /disclosures - and five third-party links carried no rel at all, four
      # of them the regulatory citations on the disclosures page itself. This
      # asserts both, over sites/ and dist/.
      - name: Validate securities disclosure and outbound link rel
        run: npm run validate:disclosure

      # Scooter's 20 Sep 2026 rule: no ventures page may navigate to the
      # community, agency or live properties; the nav is the shared seven-item
      # bar with a mobile toggle; every anchor resolves; retired pages redirect.
      - name: Validate ventures isolation and navigation
        run: npm run validate:ventures-isolation

      - name: Validate RUNBOOK.md names real paths and scripts
        run: npm run validate:runbook

      # Bing Site Scan, 25 Sep 2026: "Alt attribute for images is missing" on
      # westpeekproductions.com/community-as-a-service/ (two logos with alt="").
      # Every productions <img> must carry a non-empty alt, in sites/ and dist/.
      - name: Validate productions images carry alt text
        run: npm run validate:img-alt

      # The entity check above reads the three hand-authored index pages. This
      # asserts the property that actually ships: every built page carries an
      # Organization node, and every sitemap URL carries a real lastmod. Before
      # this, 3 of 14 built pages had Organization schema and no sitemap carried
      # a lastmod at all, and nothing would have caught the regression.
      - name: Validate built pages carry Organization schema and dated sitemaps
        run: |
          python - <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET

          pages = sorted(pathlib.Path('dist').rglob('*.html'))
          assert pages, 'no built pages found'
          missing = [str(p) for p in pages
                     if not re.search(r'"@type"\s*:\s*"Organization"', p.read_text(encoding='utf-8'))]
          assert not missing, f'pages without Organization schema: {missing}'
          print(f'Organization schema: {len(pages)}/{len(pages)} built pages')

          NS = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          total = 0
          for sm in sorted(pathlib.Path('dist').rglob('sitemap.xml')):
              urls = ET.parse(sm).getroot().findall(f'{NS}url')
              assert urls, f'{sm} lists no URLs'
              undated = [u.find(f'{NS}loc').text for u in urls if u.find(f'{NS}lastmod') is None]
              assert not undated, f'{sm}: URLs with no lastmod: {undated}'
              robots = sm.with_name('robots.txt')
              assert robots.exists(), f'{sm.parent} has a sitemap but no robots.txt'
              assert 'sitemap.xml' in robots.read_text(encoding='utf-8').lower(), \
                  f'{robots} does not point at the sitemap'
              total += len(urls)
          print(f'sitemaps: {total} URLs, every one carrying a lastmod, each referenced from robots.txt')
          PY
