<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found &middot; West Peek Ventures</title>
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="That page could not be found on West Peek Ventures.">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-card: #111111;
    --bg-elevated: #1a1a1a;
    --white: #f5f0eb;
    --white-pure: #ffffff;
    --gray: #888;
    --gray-dim: #555;
    --accent: #c45a3c;
    --accent-light: #d4715a;
    --accent-glow: rgba(196,90,60,0.15);
    --green: #4a9e6e;
    --border: rgba(255,255,255,0.07);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--white);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: white; }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 8rem 2rem 5rem;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -15%; left: 50%; transform: translateX(-50%);
    width: 800px; height: 800px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }

  /* The WP monogram replaces the white wordmark (Scooter, 20 Sep 2026). The
     supplied file is black ink on transparent; rendered white, approved. */
  .hero-logo {
    width: 96px; height: 72px; object-fit: contain; filter: invert(1);
    margin-bottom: 2rem;
    opacity: 0; animation: fadeUp 0.8s ease forwards 0.15s;
  }

  .hero h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(3rem, 6vw, 5.2rem);
    line-height: 1.08;
    letter-spacing: -0.03em;
    max-width: 850px;
    margin-bottom: 1.8rem;
    opacity: 0; animation: fadeUp 0.8s ease forwards 0.3s;
  }
  .hero h1 em { font-style: italic; color: var(--accent); }

  /* CYCLING WORDS */
  .cycle-container {
    display: inline-block;
    position: relative;
    min-width: 200px;
    text-align: center;
  }
  .cycle-word {
    display: inline-block;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    color: var(--accent);
    font-style: italic;
  }
  .cycle-word.active {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .cycle-word.exit-up {
    opacity: 0;
    transform: translateX(-50%) translateY(-20px);
  }
  .cycle-word.enter-below {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
  }

  .hero-sub {
    font-size: 1.1rem;
    color: var(--gray);
    max-width: 480px;
    line-height: 1.7;
    font-weight: 400;
    margin-bottom: 2.5rem;
    opacity: 0; animation: fadeUp 0.8s ease forwards 0.5s;
  }

  .hero-ctas {
    opacity: 0; animation: fadeUp 0.8s ease forwards 0.65s;
  }
  .btn-primary {
    background: var(--accent); color: white;
    padding: 0.9rem 2.2rem; border: none; border-radius: 4px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; text-decoration: none;
    transition: all 0.3s; display: inline-block;
  }
  .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }

  /* DIVIDER */
  .divider {
    border: none; border-top: 1px solid var(--border);
    margin: 0;
  }

  /* SECTIONS SHARED */
  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; color: var(--accent);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 12px;
  }
  .section-tag::before {
    content: ''; width: 24px; height: 1px; background: var(--accent);
  }

  /* WHAT WE BELIEVE */
  .believe {
    padding: 6rem 3rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .believe h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 3.5vw, 3rem);
    line-height: 1.1; letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }
  .believe p {
    font-size: 1.05rem; color: var(--gray);
    line-height: 1.8; max-width: 680px;
  }
  .believe p + p { margin-top: 1rem; }
  .believe p strong { color: var(--white); font-weight: 500; }

  /* SECTORS */
  .sectors {
    padding: 5rem 3rem;
    border-top: 1px solid var(--border);
  }
  .sectors-inner {
    max-width: 1100px; margin: 0 auto;
  }
  .sector-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    margin-top: 2.5rem;
  }
  .sector-card {
    background: var(--bg-card);
    padding: 2.5rem 2rem;
    transition: background 0.3s;
  }
  .sector-card:hover { background: var(--bg-elevated); }
  .sector-card h3 {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem; font-weight: 600;
    margin-bottom: 0.6rem;
  }
  .sector-card p {
    font-size: 0.85rem; color: var(--gray); line-height: 1.6;
  }

  .sectors-lead {
    font-size: 1.05rem; color: var(--gray); line-height: 1.8; max-width: 680px;
    margin-bottom: 2.5rem;
  }
  .sectors-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; color: var(--gray-dim);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin: 3rem 0 -1.5rem;
  }

  /* PORTFOLIO */
  .portfolio {
    padding: 6rem 3rem;
    border-top: 1px solid var(--border);
  }
  .portfolio-inner { max-width: 1000px; margin: 0 auto; }
  .portfolio h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 3.5vw, 3rem);
    line-height: 1.1; letter-spacing: -0.02em;
    margin-bottom: 2.5rem;
  }
  .portfolio-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
  }
  .portfolio-card {
    background: var(--bg-card);
    padding: 2rem;
    display: flex; flex-direction: column; gap: 1.25rem;
    transition: background 0.3s;
  }
  .portfolio-card:hover { background: var(--bg-elevated); }
  /* Both supplied logos are black ink on transparent. A cream tile keeps each
     brand's own mark legible on the dark ground without recolouring it. */
  .portfolio-logo {
    display: flex; align-items: center; justify-content: center;
    background: var(--white); border-radius: 4px;
    height: 76px; padding: 1.1rem 1.6rem;
  }
  .portfolio-logo img { max-height: 100%; max-width: 100%; width: auto; height: auto; object-fit: contain; display: block; }
  .portfolio-photo {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: center top;
    border-radius: 4px; display: block;
  }
  .portfolio-name {
    font-family: 'Instrument Serif', serif;
    font-size: 1.6rem; line-height: 1.1;
  }
  .portfolio-name a { color: inherit; text-decoration: none; }
  .portfolio-name a:hover { color: var(--accent-light); }
  .portfolio-founders {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem; color: var(--accent);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-top: 0.35rem;
  }
  .portfolio-links { display: flex; gap: 1.5rem; margin-top: auto; }
  .portfolio-links a {
    color: var(--gray); font-size: 0.85rem; font-weight: 500; text-decoration: none;
    border-bottom: 1px solid var(--border); padding-bottom: 2px; transition: color 0.3s, border-color 0.3s;
  }
  .portfolio-links a:hover { color: var(--white); border-color: var(--white); }

  /* TEAM */
  .team {
    padding: 6rem 3rem;
    border-top: 1px solid var(--border);
  }
  .team-inner {
    max-width: 1000px; margin: 0 auto;
  }
  .team-label-line {
    display: flex; align-items: center; gap: 1.5rem;
    margin-bottom: 3rem;
  }
  .team-label-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; color: var(--accent);
    letter-spacing: 0.18em; text-transform: uppercase;
    white-space: nowrap;
  }
  .team-label-rule {
    flex: 1; height: 1px; background: var(--border);
  }

  .team-duo-label {
    text-align: center;
    margin-bottom: 3.5rem;
  }
  .team-duo-label h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 3.5vw, 3rem);
    line-height: 1.1; letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
  }
  .duo-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
  }
  .team-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .team-card:hover { border-color: rgba(255,255,255,0.12); }
  .team-photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .team-info { padding: 2rem; }
  .team-name {
    font-family: 'Instrument Serif', serif;
    font-size: 1.6rem;
    margin-bottom: 0.2rem;
  }
  .team-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .team-bio {
    font-size: 0.9rem;
    color: var(--gray);
    line-height: 1.7;
  }
  .team-bio strong {
    color: var(--white);
    font-weight: 500;
  }

  /* JOIN COMMUNITY */
  .community {
    padding: 6rem 3rem;
    border-top: 1px solid var(--border);
  }
  .community-inner {
    max-width: 900px; margin: 0 auto;
    text-align: center;
  }
  .community h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 3.5vw, 3rem);
    line-height: 1.1; letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }
  .community p {
    font-size: 1.05rem; color: var(--gray);
    line-height: 1.8; max-width: 620px;
    margin: 0 auto 2rem;
  }
  .community .btn-primary { margin-top: 0.5rem; }

  /* APPLICATION FORM */
  .apply {
    padding: 6rem 3rem 4rem;
    border-top: 1px solid var(--border);
  }
  .apply-inner {
    max-width: 680px; margin: 0 auto;
  }
  .apply-inner h2 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2rem, 3vw, 2.5rem);
    margin-bottom: 0.8rem;
    text-align: center;
  }
  .apply-inner > p {
    font-size: 1rem; color: var(--gray);
    line-height: 1.7; margin-bottom: 2.5rem;
    text-align: center;
  }
  .apply-form {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2.5rem;
  }
  .form-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    margin-bottom: 1rem;
  }
  .form-group {
    margin-bottom: 1rem;
  }
  .form-group label {
    font-size: 0.78rem; font-weight: 500;
    color: var(--gray); display: block;
    margin-bottom: 0.4rem;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.7rem 0.9rem;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.3s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: var(--gray-dim);
  }
  .form-group textarea {
    resize: vertical; min-height: 100px;
  }

  /* The .file-upload / .file-name rules that used to live here were removed
     with the file input itself. Nothing else on the site used them. */
  .form-hint {
    font-size: 0.72rem; color: var(--gray-dim);
    margin: 0.45rem 0 0; line-height: 1.5;
  }

  .btn-submit {
    width: 100%;
    background: var(--accent); color: white;
    padding: 0.9rem; border: none; border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
    margin-top: 0.5rem;
  }
  .btn-submit:hover {
    background: var(--accent-light); transform: translateY(-1px);
  }
  .btn-submit[disabled] {
    opacity: 0.6; cursor: progress; transform: none;
  }
  .btn-submit[disabled]:hover {
    background: var(--accent); transform: none;
  }

  /* Submit outcome. shared/assets/js/forms.js is the only thing that sets
     data-state, and it only sets "ok" once the server confirmed receipt. */
  .form-status {
    font-size: 0.82rem; line-height: 1.6;
    margin: 0.9rem 0 0; min-height: 1.2em;
    color: var(--gray);
  }
  .form-status[data-state="ok"] { color: #7fd8a4; }
  .form-status[data-state="error"] { color: var(--accent-light); }
  .form-status a { color: inherit; text-decoration: underline; }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reveal {
    opacity: 0; transform: translateY(30px);
    transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reveal.visible {
    opacity: 1; transform: translateY(0);
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .hero { padding: 7rem 1.5rem 4rem; }
    .believe, .sectors, .portfolio, .team, .community, .apply { padding: 4rem 1.5rem; }
    .sector-grid { grid-template-columns: 1fr 1fr; }
    .portfolio-grid { grid-template-columns: 1fr; }
    .portfolio-card { padding: 1.5rem; }
    .team-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .apply-form { padding: 1.5rem; }
  }
</style>
